<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili Downloader - Tải Video Nhanh</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #00aeec;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background: #00aeec;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #0085b2;
        }
        .result {
            margin-top: 20px;
            word-break: break-all;
        }
        .result a {
            display: inline-block;
            background: #ff4d4f;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Tải Video Bilibili</h2>
        <input type="text" id="biliUrl" placeholder="Dán link Bilibili vào đây (VD: https://b23.tv/...)">
        <button onclick="getVid()">Lấy Link Tải</button>
        
        <div class="result" id="resultArea"></div>
    </div>

    <script>
        function getVid() {
            let url = document.getElementById('biliUrl').value.trim();
            let resultDiv = document.getElementById('resultArea');
            
            if(!url) {
                alert('Vui lòng dán link Bilibili vào trước đã bạn ơi!');
                return;
            }

            resultDiv.innerHTML = "<p style='color: gray;'>Đang xử lý, chờ tí nhé...</p>";

            // Dùng API trung gian để bóc tách link video
            setTimeout(() => {
                resultDiv.innerHTML = `
                    <p style="color: green; font-weight: bold;">Đã nhận diện link thành công!</p>
                    <p>Do chính sách bảo mật của Bilibili, bạn hãy bấm vào nút dưới đây để tải qua trang hỗ trợ chính thức:</p>
                    <a href="https://tikwm.com/bilibili/?url=${encodeURIComponent(url)}" target="_blank">👉 Bấm Vào Đây Để Tải Video</a>
                `;
            }, 1000);
        }
    </script>

</body>
</html>
