<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili Downloader</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #fb7299;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            outline: none;
        }
        input:focus {
            border-color: #fb7299;
        }
        button {
            background: #fb7299;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background: #e05d84;
        }
        .loading {
            margin-top: 15px;
            color: #666;
            font-style: italic;
            display: none;
        }
        .result {
            margin-top: 20px;
            text-align: left;
            display: none;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }
        .result a {
            display: block;
            background: #00aeec;
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Tải Video Bilibili</h2>
        <input type="text" id="urlInput" placeholder="Dán link Bilibili vào đây...">
        <button onclick="fetchVideo()">Lấy Link</button>
        
        <div id="loading" class="loading">Đang phân tích video, chờ chút nhé...</div>
        
        <div id="result" class="result">
            <p id="videoTitle" style="font-weight: bold; font-size: 14px; margin-bottom: 10px; color: #333;"></p>
            <a id="downloadBtn" href="#" target="_blank">📥 Tải Video Về Máy</a>
        </div>
    </div>

    <script>
        async function fetchVideo() {
            let url = document.getElementById('urlInput').value.trim();
            let loading = document.getElementById('loading');
            let resultBox = document.getElementById('result');
            let downloadBtn = document.getElementById('downloadBtn');
            let videoTitle = document.getElementById('videoTitle');

            if (!url) {
                alert('Chưa dán link kìa bạn ơi!');
                return;
            }

            loading.style.display = 'block';
            resultBox.style.display = 'none';

            try {
                // Sử dụng API công khai để trích xuất link ngầm
                let response = await fetch(`https://tikwm.com/api/?url=${encodeURIComponent(url)}`);
                let data = await response.json();

                loading.style.display = 'none';

                if (data && data.data) {
                    let videoData = data.data;
                    videoTitle.innerText = videoData.title || "Video Bilibili";
                    downloadBtn.href = videoData.play || videoData.url;
                    resultBox.style.display = 'block';
                } else {
                    alert('Không lấy được video, hãy kiểm tra lại link nhé!');
                }
            } catch (error) {
                loading.style.display = 'none';
                alert('Có lỗi xảy ra khi kết nối tới máy chủ giải mã!');
            }
        }
    </script>

</body>
</html>
