<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilibili Video Downloader</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            text-align: center;
        }
        h2 {
            color: #fb7299; /* Màu hồng đặc trưng của Bilibili */
            margin-bottom: 25px;
        }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #e1e4e8;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #fb7299;
        }
        button {
            background: #fb7299;
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #e05d84;
        }
        .result-box {
            margin-top: 25px;
            text-align: left;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        .result-box a {
            display: block;
            text-align: center;
            background: #00aeec;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            margin-top: 10px;
            font-weight: bold;
        }
        .loading {
            color: #666;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Bilibili Downloader</h2>
        <input type="text" id="urlInput" placeholder="Dán link Bilibili vào đây (VD: https://b23.tv/...)">
        <button onclick="handleDownload()">Tải Ngay</button>
        
        <div id="loading" class="loading" style="display: none;">Đang kết nối lấy dữ liệu video...</div>
        
        <div id="result" class="result-box">
            <p style="margin: 0 0 10px 0; font-weight: bold; color: #333;">Đã tìm thấy video của bạn:</p>
            <a id="downloadLink" href="#" target="_blank">📥 Bấm Vào Đây Để Tải Về</a>
        </div>
    </div>

    <script>
        function handleDownload() {
            let url = document.getElementById('urlInput').value.trim();
            let loading = document.getElementById('loading');
            let result = document.getElementById('result');
            let downloadLink = document.getElementById('downloadLink');

            if (!url) {
                alert('Bạn chưa dán link kìa!');
                return;
            }

            loading.style.display = 'block';
            result.style.display = 'none';

            // Mô phỏng kết nối mượt mà đến các nguồn hỗ trợ công khai sạch sẽ
            setTimeout(() => {
                loading.style.display = 'none';
                result.style.display = 'block';
                // Tạo sẵn đường dẫn sạch trỏ thẳng tới công cụ xử lý công khai không quảng cáo rác
                downloadLink.href = `https://tikwm.com/bilibili/?url=${encodeURIComponent(url)}`;
            }, 800);
        }
    </script>

</body>
</html>
