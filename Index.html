<!DOCTYPE html>
<html>
<head>
<title>Tool LQ</title>
<style>
body { background: #000; color: #fff; text-align: center; padding: 20px; font-family: sans-serif; }
canvas { border: 3px solid #ffcc00; max-width: 90%; }
</style>
</head>
<body>
<h1>TOOL TẠO ẢNH LOADING</h1>
<input type="file" id="up" accept="image/*"><br><br>
<canvas id="c" width="800" height="450"></canvas><br>
<button onclick="download()">TẢI ẢNH</button>
<script>
const c = document.getElementById('c'); const ctx = c.getContext('2d');
document.getElementById('up').onchange = function(e){
    let reader = new FileReader();
    reader.onload = function(event){
        let img = new Image();
        img.onload = function(){ ctx.drawImage(img,0,0,800,450); }
        img.src = event.target.result;
    }
    reader.readAsDataURL(e.target.files[0]);
}
function download(){
    let a = document.createElement('a');
    a.href = c.toDataURL();
    a.download = 'loading.png';
    a.click();
}
</script>
</body>
</html>
